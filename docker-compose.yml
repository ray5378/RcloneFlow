services:
  rcloneflow:
    image: ray5378/rcloneflow:latest
    container_name: rcloneflow
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - APP_ADDR=:17870
      - APP_DATA_DIR=/app/data
      - RCLONE_CONFIG=/app/data/rclone.conf
      - EMBED_RC=true
      - RCLONE_RC_URL=http://127.0.0.1:5572
      - RCLONE_RC_USER=rc
      - RCLONE_RC_PASS=rcpass
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./app/data:/app/data
    restart: always
networks: {}