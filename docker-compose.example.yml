services:
  rcloneflow:
    image: ray5378/rcloneflow:latest
    container_name: rcloneflow
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - APP_ADDR=:17870
      - APP_DATA_DIR=/app/data
      - RCLONE_CONFIG=/app/data/rclone.conf
      # 内置 RC（用于 remotes/providers/config/browser）
      - EMBED_RC=true
      - RCLONE_RC_URL=http://127.0.0.1:5572
      - RCLONE_RC_USER=rc
      - RCLONE_RC_PASS=rcpass
      # 日志级别：debug|info|warn|error
      - LOG_LEVEL=info
      # 运行时用户（匹配宿主机 UID/GID 以解决卷权限问题）
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./data:/app/data
    restart: always