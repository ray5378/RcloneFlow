name: Create and Push Multi-Arch Manifest

on:
  workflow_run:
    workflows:
      - "Build and Push Docker Image (ARM64)"
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

jobs:
  create-manifest:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short hash
        id: hash
        run: echo "short=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Wait for AMD64 image
        run: |
          SHORT_SHA=${{ steps.hash.outputs.short }}
          MAX_WAIT=300
          WAIT_INTERVAL=10
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            if docker pull ray5378/rcloneflow:master-${SHORT_SHA} > /dev/null 2>&1; then
              echo "AMD64 image found"
              exit 0
            fi
            echo "Waiting for AMD64 image... ($ELAPSED/$MAX_WAIT seconds)"
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
          done
          
          echo "Timeout waiting for AMD64 image"
          exit 1

      - name: Create and push manifest
        run: |
          SHORT_SHA=${{ steps.hash.outputs.short }}
          
          # Pull both images
          docker pull ray5378/rcloneflow:master-${SHORT_SHA}
          docker pull ray5378/rcloneflow:master-${SHORT_SHA}-arm64
          
          # Create manifest
          docker manifest create ray5378/rcloneflow:latest \
            --amend ray5378/rcloneflow:master-${SHORT_SHA} \
            --amend ray5378/rcloneflow:master-${SHORT_SHA}-arm64
          
          # Push manifest
          docker manifest push ray5378/rcloneflow:latest
